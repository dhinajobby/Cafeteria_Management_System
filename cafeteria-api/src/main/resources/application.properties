spring.application.name=cafeteria-api

# --- MySQL connection: matches the cafeteria_db schema you already created ---
spring.datasource.url=jdbc:mysql://localhost:3306/cafeteria_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tables already exist (you ran the CREATE TABLE script), so never let Hibernate
# drop/recreate them. "validate" just checks the entities match your schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
