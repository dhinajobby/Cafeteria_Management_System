<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annapurna&trade; - Administrator Login</title>
  <meta name="description" content="Secure administrative login for Annapurna Cafeteria staff to manage menu items, pricing, and stock.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Ctext%20y=%22.9em%22%20font-size=%2290%22%3E%E2%98%95%3C/text%3E%3C/svg%3E">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Antigravity Canvas Particle Animation -->
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div class="page-wrapper">
    <div class="login-container">

      <!-- Return to Kiosk Top Link -->
      <div class="login-top-nav">
        <a href="index.html" class="btn-return-kiosk-link">
          <span>&larr;</span>
          <span>Return to Customer Kiosk</span>
        </a>
      </div>

      <!-- Login Card -->
      <main class="login-card" role="main">
        <div class="login-card-header">
          <div class="admin-badge-pill">
            <span>🔐</span>
            <span>Staff Portal</span>
          </div>
          <h1 class="login-title">Administrator Login</h1>
          <p class="login-subtitle">
            Sign in to manage cafeteria foods, customize pricing, update available stock, and monitor orders.
          </p>
        </div>

       

        <!-- Error Banner -->
        <div class="login-error-banner" id="login-error-banner" style="display: none;" role="alert">
          <span id="login-error-text">Invalid credentials.</span>
        </div>

        <!-- Login Form -->
        <form id="admin-login-form" class="login-form" novalidate>
          <div class="form-group">
            <label for="admin-username" class="form-label">Username</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input 
                type="text" 
                id="admin-username" 
                class="form-input" 
                placeholder="Enter admin username" 
                value="admin@cafeteria.com"
                required 
                autocomplete="username"
              >
            </div>
          </div>

          <div class="form-group">
            <label for="admin-password" class="form-label">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input 
                type="password" 
                id="admin-password" 
                class="form-input" 
                placeholder="Enter password" 
                value="Asiet@123"
                required 
                autocomplete="current-password"
              >
              <button type="button" class="btn-toggle-password" id="toggle-password-btn" aria-label="Toggle password visibility">
                👁️
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login-submit" id="btn-login-submit">
            <span>Sign In to Admin Dashboard</span>
            <span>&rarr;</span>
          </button>
        </form>

        <div class="login-card-footer">
          <p>Campus Cafeteria Management System &bull; Annapurna&trade;</p>
        </div>
      </main>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/particles.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect directly to admin.html
      if (AuthManager.isLoggedIn()) {
        window.location.href = 'admin.html';
        return;
      }

      const form = document.getElementById('admin-login-form');
      const usernameInput = document.getElementById('admin-username');
      const passwordInput = document.getElementById('admin-password');
      const errorBanner = document.getElementById('login-error-banner');
      const errorText = document.getElementById('login-error-text');
      const togglePasswordBtn = document.getElementById('toggle-password-btn');

      // Password visibility toggle
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
      });

      // Handle form submission
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
          showError('Please enter both username and password.');
          return;
        }

        const result = AuthManager.login(username, password);
        if (result.success) {
          // Redirect to Admin Dashboard
          window.location.href = 'admin.html';
        } else {
          showError(result.message || 'Invalid username or password.');
          passwordInput.value = '';
          passwordInput.focus();
        }
      });

      function showError(msg) {
        errorText.textContent = msg;
        errorBanner.style.display = 'flex';
        errorBanner.classList.add('shake');
        setTimeout(() => errorBanner.classList.remove('shake'), 500);
      }
    });
  </script>
</body>
</html>
